version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: feedbackai-postgres-dev
    environment:
      POSTGRES_DB: feedbackai
      POSTGRES_USER: feedbackai
      POSTGRES_PASSWORD: feedbackai123
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedbackai"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_dev:
