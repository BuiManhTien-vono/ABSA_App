server:
  port: 8080

spring:
  application:
    name: feedback-ai-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:feedbackai}
    username: ${DB_USER:feedbackai}
    password: ${DB_PASSWORD:feedbackai123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# ─── JWT ───────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:super-secret-key-change-in-production-must-be-at-least-256-bits-long!!}
  expiration-ms: ${JWT_EXPIRATION:86400000}

# ─── AI Service ────────────────────────────────────────────────────────────────
ai-service:
  base-url: ${AI_SERVICE_URL:http://localhost:8000}
  internal-token: ${INTERNAL_TOKEN:changeme}

# ─── Polling Scheduler ────────────────────────────────────────────────────────
polling:
  interval-ms: ${POLLING_INTERVAL:300000}
  negative-spike-threshold: ${NEGATIVE_SPIKE_THRESHOLD:0.4}

# ─── Frontend CORS ────────────────────────────────────────────────────────────
frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

# ─── OAuth Platform Configs ───────────────────────────────────────────────────
oauth:
  shopee:
    client-id: ${SHOPEE_CLIENT_ID:}
    client-secret: ${SHOPEE_CLIENT_SECRET:}
    redirect-uri: ${SHOPEE_REDIRECT_URI:http://localhost:8080/api/shops/callback/shopee}
    authorize-url: https://partner.shopeemobile.com/api/v2/shop/auth_partner
    token-url: https://partner.shopeemobile.com/api/v2/auth/token/get
  lazada:
    client-id: ${LAZADA_CLIENT_ID:}
    client-secret: ${LAZADA_CLIENT_SECRET:}
    redirect-uri: ${LAZADA_REDIRECT_URI:http://localhost:8080/api/shops/callback/lazada}
    authorize-url: https://auth.lazada.com/oauth/authorize
    token-url: https://auth.lazada.com/rest/auth/token/create
  tiktok:
    client-id: ${TIKTOK_CLIENT_ID:}
    client-secret: ${TIKTOK_CLIENT_SECRET:}
    redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:8080/api/shops/callback/tiktok}
    authorize-url: https://auth.tiktok-shops.com/oauth/authorize
    token-url: https://auth.tiktok-shops.com/api/v2/token/get

logging:
  level:
    com.feedbackai: DEBUG
    org.springframework.security: INFO
