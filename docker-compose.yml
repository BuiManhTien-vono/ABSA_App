services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: higen-sqlserver
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=HigenAbsa@2026!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'HigenAbsa@2026!' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'HigenAbsa@2026!' -Q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 15

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: higen-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./backend-dotnet/database/01_init_schemas_and_tables.sql:/init.sql:ro
    command: >
      bash -c "
        echo 'Dang cho SQL Server san sang de khoi tao schema HigenAbsaDb...'
        for i in {1..30}; do
          (/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'HigenAbsa@2026!' -C -i /init.sql || /opt/mssql-tools/bin/sqlcmd -S sqlserver -U sa -P 'HigenAbsa@2026!' -i /init.sql) && echo 'Khoi tao HigenAbsaDb thanh cong!' && exit 0 || sleep 2
        done
        echo 'Loi ket noi khoi tao DB'
        exit 1
      "
    restart: "no"

  backend:
    build:
      context: ./backend-dotnet
      dockerfile: Dockerfile
    image: higen-backend:latest
    container_name: higen-backend
    restart: unless-stopped
    ports:
      - "5058:5058"
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=HigenAbsaDb;User Id=sa;Password=HigenAbsa@2026!;TrustServerCertificate=True;MultipleActiveResultSets=true;
      - Absa__ModelDir=/app/models
    volumes:
      - ./ai-service/models/visobert_absa_v8:/app/models:ro

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: higen-frontend:latest
    container_name: higen-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mssql_data:
