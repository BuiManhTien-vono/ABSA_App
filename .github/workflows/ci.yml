name: HIGEN-ABSA CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend Build & In-Memory Tests (.NET 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore backend-dotnet/HigenAbsa.slnx

      - name: Build Backend Solution
        run: dotnet build backend-dotnet/HigenAbsa.slnx --no-restore --configuration Release /p:TreatWarningsAsErrors=false

      - name: Run SOTA In-Memory Unit & Architecture Tests
        run: dotnet test backend-dotnet/tests/HigenAbsa.UnitTests/HigenAbsa.UnitTests.csproj --no-build --configuration Release --logger "trx;LogFileName=test_results.trx"

      - name: Upload Test Results Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend-dotnet/tests/HigenAbsa.UnitTests/TestResults/test_results.trx

  frontend-ci:
    name: Frontend Build & RAM Tests (React 19 / Vitest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Frontend SPA
        working-directory: frontend
        run: npm run build

      - name: Run Frontend RAM Tests (Vitest)
        working-directory: frontend
        run: npm run test:ram

  docker-verification:
    name: Docker Containerization Build Check
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-dotnet
          file: ./backend-dotnet/Dockerfile
          push: false
          tags: higen-absa-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: higen-absa-frontend:ci
